services:
  db:
    image: postgres:16
    container_name: casebot-db
    environment:
      POSTGRES_USER: casebot
      POSTGRES_PASSWORD: casebot_dev_pass
      POSTGRES_DB: casebot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: casebot-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: